      return `<div class="sgrp"><h3>Sessions</h3><p class="gdesc">How the sidebar lists your terminals.</p>`
        + segRow("Default sort", "Recent groups by day. The others sort across all your terminals.", "sort",
            [["recent","Recent"],["tokens","Most tokens"],["tasks","Most tasks"],["saved","Saved first"]])
        + swRow("Confirm before delete", "Ask first when deleting a terminal.", "confirmdelete")
        + `</div>`;
    }
    // Sort a session list per the chosen order. "recent" keeps the server's mtime-desc order.
    function sortSessions(list) {
      const arr = list.slice();
      if (settings.sort === "tokens") return arr.sort((a, b) => (b.tokens || 0) - (a.tokens || 0));
      if (settings.sort === "tasks") return arr.sort((a, b) => (b.taskCount || 0) - (a.taskCount || 0));
      if (settings.sort === "saved") return arr.sort((a, b) => (b.saved ? 1 : 0) - (a.saved ? 1 : 0));
      return arr;
    }
    const SORT_LABELS = { tokens: "Most tokens", tasks: "Most tasks", saved: "Saved first" };
    function renderAboutGroup() {
      return `<div class="sgrp"><h3>About</h3>`
        + `<p class="gdesc">Codey narrates a live Claude Code session in plain English and flags when it looks stuck.</p>`
        + `<div class="srow"><div class="srmeta"><div class="rt">Reset all settings</div>`
        + `<div class="rd">Restores every setting on this page to its default. Does not touch your bookmarks.</div></div>`
        + `<button class="sresetbtn" id="reset-settings" type="button">Reset</button></div>`
        + `</div>`;
    }
    function wireLiveControls(el) {
      el.querySelectorAll(".spreset[data-preset]").forEach((p) => p.addEventListener("click", () => {
        applyPreset(p.dataset.preset);
        renderSettings();
      }));
    }
    function wireAboutControls(el) {
      const rb = el.querySelector("#reset-settings");
      if (!rb) return;
      rb.addEventListener("click", () => {
        resetSettings();
        // Narration lives in its own null-until-seeded vars; clear them too so reset is honest,
        // then let the next render re-seed them from the open session's mode.
        localStorage.removeItem("codey-depth"); localStorage.removeItem("codey-gen");
        depth = null; genMode = null;
        followLive = settings.follow === "1";
        applyMode();
        if (lastSnap) renderSingle(lastSnap);
        refreshRail();
        renderSettings();
      });
    }
    function refreshRail() { if (lastSessions && lastSessions.length) renderRailList(lastSessions); }

    // ---- Explanations: generated why/how and per-prompt summaries ----
    const explCache = new Map();   // "scope|id|depth" -> generated text (survives the live refresh)
    const explLoading = new Set(); // keys currently generating
    const autoFired = new Set();   // summary keys Auto has already requested, so it fires once per depth
    let budgetPaused = false;      // a generation hit the budget cap
    let depth = localStorage.getItem("codey-depth");   // null until seeded from the snapshot mode
    let genMode = localStorage.getItem("codey-gen");   // "auto" | "saver", null until seeded
    let lastSnap = null;           // last single-view snapshot, for re-render after a generation
    let liveNow = false;           // a session is actively running, so poll faster
    const curDepth = () => depth || "deep";
    // Re-tint the whole page to the active narration mode by swapping <body data-mode>. Simple,
    // Deep and Teach each drive a different --accent, so the chrome reads as the mode you are in.
    const applyMode = () => { document.body.dataset.mode = curDepth(); };
    applyMode();
    // While an Active Terminals pane is being built, renderDepth holds that pane's chosen depth so
    // every explanation/summary block keys and labels at the pane's depth, not the page default.
    // It is null in the single view and reset to null after each pane, so nothing leaks across panes.
    let renderDepth = null;
    const activeDepth = () => renderDepth || curDepth();
    // The session an id belongs to. Active Terminals panes embed it as "<sid>~<id>"; the single
    // view uses bare positional ids (p1, c2), so they belong to whatever session is open now.
    // Folding the session into every cache key is what stops one session's recap or explanation
    // from showing under another session's prompt when their positional ids happen to line up.
    const idSession = (id) => { const t = String(id).indexOf("~"); return t !== -1 ? String(id).slice(0, t) : (currentId || ""); };
    const cacheKey = (scope, id, d) => idSession(id) + "|" + scope + "|" + id + "|" + d;
    const ekey = (scope, id) => cacheKey(scope, id, activeDepth());
    const firstSentence = (t) => String(t).split(/(?<=[.?!])\s+/)[0] || String(t);
    // The one-line skim echo for a finished prompt. A sectioned recap leads with "What changed:",
    // so drop that label and take the first line and sentence, keeping the echo a clean phrase.
    const echoText = (s) => firstSentence(String(s).replace(/^\s*what changed\s*:\s*/i, "").split(/\n/)[0]);

    async function generate(scope, id, rerender, gdepth) {
      // Active Terminals namespaces ids as "<sessionId>~<chunkId>" so a button knows its own
      // session; the single view uses a bare id and the current session. Split on the first ~.
      let sessionId = currentId, serverId = id;
      const tilde = id.indexOf("~");
      if (tilde !== -1) { sessionId = id.slice(0, tilde); serverId = id.slice(tilde + 1); }
      if (!sessionId) return;
      const redraw = rerender || (() => { if (lastSnap) renderSingle(lastSnap); });
      // The depth comes from the button that was clicked (a pane carries its own), not the live
      // render context, which is null by the time this async click handler runs.
      const d = gdepth || curDepth();
      const key = cacheKey(scope, id, d);
      if (explCache.has(key) || explLoading.has(key)) return;
      explLoading.add(key);
      redraw();
      try {
        const res = await fetch("/api/session/" + encodeURIComponent(sessionId) + "/explain", {
          method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({ scope, id: serverId, depth: d }),
        });
        const data = await res.json();
        if (data && data.paused) budgetPaused = true;
        else if (data && data.text) { explCache.set(key, data.text); budgetPaused = false; }
      } catch { /* leave the button so the user can retry */ }
      explLoading.delete(key);
      redraw();
    }

    // Pre-load any explanations the snapshot already carries, so a reopened timeline shows them
    // without a round-trip. Two sources: the seed-depth fields embedded on chunks/groups, and the
    // flat cachedExplanations map (every scope and depth the user ever generated, read from disk).
    // The map is what makes clicked work survive a tab close or a fresh session: it was already
    // paid for, so we just repaint it. Never clobber a fresher client value.
    function seedEmbedded(snap) {
      const sd = snap.seedDepth || "deep";
      for (const c of snap.chunks || []) {
        if (c.explanation) { const k = cacheKey("task", c.id, sd); if (!explCache.has(k)) explCache.set(k, c.explanation); }
      }
      for (const g of snap.groups || []) {
        if (g.summary) { const k = cacheKey("summary", g.id, sd); if (!explCache.has(k)) explCache.set(k, g.summary); }
      }
      // Map keys are "scope|id|depth" for this session; fold in the owning session id to match the
      // explCache convention (idSession resolves bare ids to the open session) and avoid collisions.
      const cached = snap.cachedExplanations || {};
      for (const mk in cached) {
        const k = snap.sessionId + "|" + mk;
        if (!explCache.has(k)) explCache.set(k, cached[mk]);
      }
    }

    function renderControls(snap) {
      const el = document.getElementById("tlctl");
      if (!el) return;
      const seg = (val, cur, label) => `<button data-val="${val}" class="${val === cur ? "on" : ""}" type="button">${label}</button>`;
      const cue = snap.budgetLeft
        ? `<span class="budgetcue${/reach/.test(snap.budgetLeft) ? " low" : ""}">${esc(snap.budgetLeft)}</span>` : "";
      el.innerHTML =
        `<div class="ctlgrp"><span class="cl">Depth</span><div class="seg" id="seg-depth">`
        + seg("simple", curDepth(), "Simple") + seg("deep", curDepth(), "Deep") + seg("teach", curDepth(), "Teach") + `</div></div>`
        + `<div class="ctlgrp"><span class="cl">Summaries</span><div class="seg" id="seg-gen">`
        + seg("auto", genMode, "Auto") + seg("saver", genMode, "Manual") + `</div></div>`
        + cue;
      el.querySelectorAll("#seg-depth button").forEach((b) => b.addEventListener("click", () => {
        depth = b.dataset.val; localStorage.setItem("codey-depth", depth); autoFired.clear();
        applyMode();
        if (lastSnap) renderSingle(lastSnap);
      }));
      el.querySelectorAll("#seg-gen button").forEach((b) => b.addEventListener("click", () => {
        genMode = b.dataset.val; localStorage.setItem("codey-gen", genMode);
        if (lastSnap) renderSingle(lastSnap);
      }));
    }

    // The generated why/how panel for an open task. Works in both the single view and the
    // Active Terminals panes; panes pass a session-namespaced id so generate hits the right one.
    function explainBlock(scope, id) {
      const key = ekey(scope, id);
      const cached = explCache.get(key);
      if (cached) return `<div class="expla"><div class="et">&#9670; Why &amp; how <span class="edepth">${esc(activeDepth())}</span></div><div class="expls">${sectionCards(cached, TASK_LABELS, null)}</div></div>`;
      if (explLoading.has(key)) return `<div class="genwrap"><span class="gening"><span class="spin"></span>Explaining at ${esc(activeDepth())} depth…</span></div>`;
      if (budgetPaused) return `<div class="gpaused">Budget reached, so Codey paused explaining.</div>`;
      return `<div class="genwrap"><button class="genbtn" type="button" data-gen-scope="${scope}" data-gen-id="${esc(id)}" data-gen-depth="${esc(activeDepth())}"><span class="ic">&#9670;</span> Explain this task</button>`
        + `<div class="genhint">Generates a ${esc(activeDepth())} explanation. Uses your Codey tokens.</div></div>`;
    }

    // The closing recap card for a prompt group.
    function summaryBlock(g) {
      const key = ekey("summary", g.id);
      const cached = explCache.get(key);
      if (cached) return `<div class="recap"><div class="rt"><span class="ic">&#9670;</span> What Claude got done</div><div class="expls">${sectionCards(cached, SUMMARY_LABELS, null)}</div></div>`;
      if (explLoading.has(key)) return `<div class="recap"><span class="gening"><span class="spin"></span>Summarizing this prompt…</span></div>`;
      if (g.live) return `<div class="recap"><span class="pend">A recap appears here once Claude finishes this prompt.</span></div>`;
      if (budgetPaused) return `<div class="recap"><span class="pend warn">Budget reached, so Codey paused explaining.</span></div>`;
      return `<div class="recap"><button class="genbtn" type="button" data-gen-scope="summary" data-gen-id="${esc(g.id)}" data-gen-depth="${esc(activeDepth())}"><span class="ic">&#10022;</span> Summarize this prompt</button>`
        + `<div class="genhint">Generates a ${esc(activeDepth())} recap. Uses your Codey tokens.</div></div>`;
    }

    // ---- Live NOW strip + Follow Live ----
    let followLive = settings.follow === "1";   // persisted; token-saver turns it off
    let nowState = null;     // last /now payload, for re-rendering the strip on toggle
    let lastLiveGroupId = null; // the live prompt group last seen, so a new prompt re-engages follow

    function renderNow(n) {
      const strip = document.getElementById("nowstrip");
      if (!strip) return;
      // The strip is live when the cheap /now feed says so, OR when the full snapshot still reads
      // as live. The two use different windows (now = a short gap bridge, snapshot = the whole
      // turn), so trusting only /now made the strip vanish while the page still said "Working
      // now". Falling back to the snapshot keeps the strip and the page in agreement mid-turn.
      const live = (n && n.live) || (lastSnap && lastSnap.live);
      if (!live || view !== "single") { strip.hidden = true; return; }
      strip.hidden = false;
      n = n || {};
      // Name the exact step: the tool tag plus its literal target (the real command/file), so
      // the strip says "Bash mkdir -p out && ..." not a vague "running a few shell commands".
      const tool = n.action ? `<span class="ntool">${esc(n.action.tool)}</span>` : "";
      const act = n.action
        ? `${tool}<span class="nact">${esc(n.action.detail || n.action.label)}</span>`
        : n.thinking ? `<span class="nact think">Thinking about your request</span>` : `<span class="nact">Working</span>`;
      const timer = n.since ? `<span class="ntime timer" data-since="${n.since}">${fmtDur(Date.now() - n.since)}</span>` : "";
      const follow = `<button class="follow${followLive ? " on" : ""}" id="follow-toggle" type="button">`
        + `<span class="fd"></span>${followLive ? "Following" : "Follow live"}</button>`;
      const trail = (n.steps && n.steps.length)
        ? `<div class="ntrail"><span class="lab">just did</span>`
          + n.steps.map((s) => `<span class="stp"><span class="k${s.status === "fail" ? " f" : ""}">`
            + `${s.status === "fail" ? "&#10007;" : "&#10003;"}</span> ${esc(s.label)}</span>`).join("")
          + `</div>`
        : "";
      strip.innerHTML = `<div class="nowtop"><span class="neye"><span class="ndot"></span>Live</span>${act}${timer}${follow}</div>${trail}`;
      document.getElementById("follow-toggle").addEventListener("click", () => setFollow(!followLive));
    }

    function setFollow(on) {
      followLive = on;
      settings.follow = on ? "1" : "0";
      localStorage.setItem("codey-follow", settings.follow);
      renderNow(nowState);
      // Reflect the followed anchor right away without a full re-render.
      document.querySelectorAll(".grp.live").forEach((el) => el.classList.toggle("following", on));
      if (on) scrollToLive();
    }

    // Keep the newest activity in view, but only nudge when new content has pushed it off the
    // bottom, so a user reading at the end is not yanked every second.
    function scrollToLive() {
      if (!followLive) return;
      const fromBottom = document.body.scrollHeight - (window.scrollY + window.innerHeight);
      if (fromBottom > 40) window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    }

    // A deliberate scroll up means "let me read"; pause following until the user opts back in.
    window.addEventListener("wheel", (e) => { if (e.deltaY < 0 && followLive) setFollow(false); }, { passive: true });

    async function tickNow() {
      if (view !== "single" || !currentId) { renderNow(null); return; }
      try {
        nowState = await (await fetch("/api/session/" + encodeURIComponent(currentId) + "/now")).json();
        renderNow(nowState);
        if (nowState.live && followLive) scrollToLive();
      } catch { /* keep the last strip on a transient error */ }
    }

    // ---- Intervention (Plan 3), preserved ----
    const FALLBACK = {
      nudge: { label: "Nudge it to move on", do: "If Claude keeps repeating it, press Esc to interrupt, then paste this so it skips the stuck step:",
        type: "You're looping on {tool}. Stop retrying that step and move on to the rest of the task." },
      different: { label: "Try a different approach", do: "If Claude keeps hitting the same error, press Esc, then paste this to push it toward a new method:",
        type: "{tool} keeps failing the same way. Stop and try a clearly different approach. If you know why it's failing, fix that cause first." },
      stop: { label: "Stop & ask me", do: "To take over right now, press Esc, then tell Claude what you want. You can start with:",
        type: "Stop what you're doing and wait. I want to take over and tell you what to do next." },
    };
    function stuckPhrase(w) {
      if (w.kind === "repeat_error") return `hit the same error ${w.count} times`;
      if (w.kind === "hang") return "been stuck on this step for a while";
      return `tried the same step ${w.count} times`;
    }
    function confirmedHtml(action, tool) {
      const f = FALLBACK[action];
      const typed = f.type.replace("{tool}", tool);
      return `<div class="intervene confirmed" data-tool="${esc(tool)}" data-action="${esc(action)}"><div class="intervene-after">`
        + `<div class="sent">&#10003; Sent &ldquo;${esc(f.label)}.&rdquo; It lands on Claude's next <span class="mono">${esc(tool)}</span> call.</div>`
        + `<div class="do">${esc(f.do)}</div>`
        + `<div class="copy"><code>${esc(typed)}</code><button class="copybtn" type="button">Copy</button></div></div></div>`;
    }
    function interventionBar(warning, chunkId) {
      const tool = warning.tool;
      const action = confirmed.get(chunkId);
      if (action) return confirmedHtml(action, tool);
      return `<div class="intervene" data-tool="${esc(tool)}" data-chunk="${esc(chunkId)}">`
        + `<div class="intervene-head"><span class="ico">&#9888;</span> Claude has ${esc(stuckPhrase(warning))}. Want to step in?</div>`
        + `<div class="intervene-btns">`
        + `<button class="ibtn primary" type="button" data-action="nudge">Nudge it to move on</button>`
        + `<button class="ibtn" type="button" data-action="different">Try a different approach</button>`
        + `<button class="ibtn ghost" type="button" data-action="stop">Stop &amp; ask me</button></div>`
        + `<div class="intervene-note">Sends Claude a note on its next step. Takes effect within a second or two; doesn't cancel your message.</div></div>`;
    }
    function warningPill(ws) {
      const rep = ws.find((w) => w.kind === "repeat_error");
      if (rep) return `<span class="pill amber">&#9888; same error &times;${rep.count}</span>`;
      const loop = ws.find((w) => w.kind === "loop");
      if (loop) return `<span class="pill amber">&#9888; same step &times;${loop.count}</span>`;
      return "";
    }

    // A card is open when the user opened it, or when it is the running task we auto-open to show
    // the current step (unless the user has explicitly collapsed that one).
    function isCardOpen(id) {
      if (open.has(id)) return true;
      return id === liveOpenId && !closedByUser.has(id);
    }

    // The step Claude is on inside the running task: the latest line with no result yet, or just
    // the latest line if everything so far has finished.
    function currentLineIndex(lines) {
      for (let i = lines.length - 1; i >= 0; i--) {
        if (lines[i].status !== "ok" && lines[i].status !== "fail") return i;
      }
      return lines.length - 1;
    }

    // ---- Receipt ----
    function actionCount(receipt) { return receipt.workLines.filter((l) => l.status !== "none").length; }

    function baseName(p) {
      const a = String(p).replace(/["']/g, "").split(/[\\/]/);
      return a[a.length - 1] || String(p);
    }

    // The compact metadata under a row's title: the real file or command, the tool, the time.
    function metaSubject(l) {
      if (!l.raw) return "";
      if (["Read", "Edit", "MultiEdit", "Write", "NotebookEdit"].includes(l.tool)) return baseName(l.raw);
      const one = String(l.raw).split("\n")[0];
      return one.length > 44 ? one.slice(0, 43) + "…" : one;
    }
    function lineMeta(l) {
      const bits = [];
      const s = metaSubject(l);
      if (s) bits.push(`<span class="f">${esc(s)}</span>`);
      if (l.tool && l.tool !== "thinking") bits.push(esc(l.tool));
      if (l.ts) bits.push(esc(fmtClockSec(l.ts)));
      return bits.join(" · ");
    }

    // Split a generated explanation into labeled section cards. The model is asked to start each
    // part with a known label and a colon; each becomes its own titled block so a longer, multi
    // part explanation stays organized and skimmable instead of a wall of text. Any text before
    // the first label shows as an unlabeled lead. With no labels at all, the whole thing shows as
    // one block, under the fallback heading when one is given, or plain when it is null.
    // Strip markdown emphasis a model slipped into an explanation (bold **, __, inline `code`, and
    // leading heading hashes). The backend strips this now, but explanations cached on disk before
    // that fix still carry the markers, so we clean them here too. Newlines are kept so the section
    // parser still sees each label on its own line.
    function stripExplMarkup(s) {
      return String(s)
        .replace(/\*\*/g, "").replace(/__/g, "").replace(/`+/g, "")
        .replace(/(^|\n)[ \t]*#{1,6}[ \t]*/g, "$1")
        .replace(/[^\S\n]{2,}/g, " ").replace(/[ \t]+\n/g, "\n").trim();
    }

    function sectionCards(text, labels, fallbackHead) {
      const t = stripExplMarkup(text);
      const alt = labels.map((d) => d[0].replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|");
      const re = new RegExp("(" + alt + ")\\s*:", "ig");
      const headOf = new Map(labels.map((d) => [d[0], d[1]]));
      const hits = [];
      let m;
      while ((m = re.exec(t))) hits.push({ key: m[1].toLowerCase(), at: m.index, end: re.lastIndex });
      const block = (head, body) =>
        `<div class="exs">${head ? `<div class="exh">${esc(head)}</div>` : ""}<div class="ext">${esc(body)}</div></div>`;
      if (!hits.length) return block(fallbackHead, t);
      let html = "";
      const lead = t.slice(0, hits[0].at).trim();
      if (lead) html += block(null, lead);
      for (let i = 0; i < hits.length; i++) {
        const seg = t.slice(hits[i].end, i + 1 < hits.length ? hits[i + 1].at : undefined).trim();
        if (seg) html += block(headOf.get(hits[i].key) || hits[i].key, seg);
      }
      return html;
    }

    // The label sets each explanation scope is asked to produce, mapped to display headings.
    const STEP_LABELS = [["why this mattered", "Why this mattered"], ["how claude did it", "How Claude did it"], ["concept", "Concept used"]];
    const TASK_LABELS = [["what claude did", "What Claude did"], ["why it mattered", "Why it mattered"], ["how it worked", "How it worked"], ["concept", "Concept used"]];
    const SUMMARY_LABELS = [["what changed", "What changed"], ["why it mattered", "Why it mattered"], ["files touched", "Files touched"], ["verification", "Verification"], ["what's left", "What's left"], ["whats left", "What's left"], ["concept", "Concept used"]];

    // A step keeps its old fallback heading, so a label-less reply still reads as a reason.
    function explainSections(text) { return sectionCards(text, STEP_LABELS, "Why this mattered"); }

    // The "Explain this step" button, shown until an explanation is generated or loading. A
    // thinking row with no concrete decision (explainable === false) gets no button: there is
    // nothing specific to explain, and generating filler is exactly what this pass removes.
    function actionWhyBtn(c, l, idx) {
      if (l && l.explainable === false) return "";
      const key = ekey("action", c.id + "#" + idx);
      if (explCache.has(key) || explLoading.has(key) || budgetPaused) return "";
      return `<button class="whybtn primary" type="button" data-gen-scope="action" data-gen-id="${esc(c.id + "#" + idx)}" data-gen-depth="${esc(activeDepth())}">Explain this step</button>`;
    }
    // The generated why/how panel for a step: cached sections, a spinner, or a budget notice.
    function actionWhyOut(c, idx) {
      const key = ekey("action", c.id + "#" + idx);
      const cached = explCache.get(key);
      if (cached) return `<div class="expls">${explainSections(cached)}</div>`;
      if (explLoading.has(key)) return `<div class="expls"><span class="gening"><span class="spin"></span>Explaining at ${esc(activeDepth())} depth…</span></div>`;
      if (budgetPaused) return `<div class="expls paused">Budget reached, so Codey paused explaining.</div>`;
      return "";
    }

    // The expanded panel under a row: the explain/raw buttons first, then the generated
    // explanation, then the raw command/path/error tucked behind "Show raw details".
    function lineDetail(c, l, idx) {
      const key = c.id + ":" + idx;
      const rawShown = rawOpen.has(key);
      const hasRaw = !!(l.raw || l.why || l.thoughtFirst || (l.status === "fail" && l.errorText));
      const rawBtn = hasRaw
        ? `<button class="rawbtn" type="button" data-raw="${esc(key)}">${rawShown ? "Hide raw details" : "Show raw details"}</button>` : "";
      const acts = `<div class="lacts">${actionWhyBtn(c, l, idx)}${rawBtn}</div>`;

      const raw = [];
      if (rawShown) {
        if (l.thoughtFirst) raw.push(`<div class="rd"><span class="rk">first</span><span class="rv">Claude paused to think before this step.</span></div>`);
        if (l.raw) raw.push(`<div class="rd"><span class="rk">ran</span><code>${esc(l.raw)}</code></div>`);
        if (l.why) raw.push(`<div class="rd"><span class="rk">Claude's note</span><span class="rv">${esc(l.why)}</span></div>`);
        if (l.status === "fail" && l.errorText) raw.push(`<div class="rd err"><span class="rk">error</span><code>${esc(l.errorText)}</code></div>`);
      }
      const rawBox = raw.length ? `<div class="rawbox">${raw.join("")}</div>` : "";
      return `<div class="ldetail">${acts}${actionWhyOut(c, idx)}${rawBox}</div>`;
    }

    function workLineHtml(c, l, idx, isCur) {
      const think = l.tool === "thinking";
      const sw = l.status === "fail" ? "sw fail" : think ? "sw think" : "sw";
      const tag = think ? `<span class="tag think">thinking</span>` : `<span class="tag tool">${esc(l.tool)}</span>`;
      // The running step shows a live pip instead of a status mark.
      const st = isCur ? '<span class="curpip" title="running now"></span>'
        : l.status === "fail" ? '<span class="st fail">fail</span>'
        : l.status === "ok" ? '<span class="st ok">&#10003;</span>' : '<span class="st">&middot;</span>';
      const key = c.id + ":" + idx;
      const lo = lineOpen.has(key);
      // Both timeline views let every line expand, since even a bare step offers an "explain this
      // step" button (panes wire it per session, like the single view).
      const canExpand = view === "single" || view === "split" || !!(l.raw || l.why || l.ts || (l.status === "fail" && l.errorText));
      const chev = canExpand ? `<span class="lchev">${lo ? "&#9662;" : "&#9656;"}</span>` : `<span class="lchev sp"></span>`;
      const fail = l.status === "fail" && l.failSummary
        ? `<div class="failnote">${esc(l.failSummary)}${l.resolved ? ' <span class="note">&middot; recovered on the next try</span>' : ""}</div>` : "";
      const meta = lineMeta(l);
      // The collapsed row reads top to bottom: purpose title, the plain sentence, then the small
      // file/tool/time line. It is understandable without expanding; expanding only adds depth.
      const main = `<div class="lmain"><span class="lbl">${esc(l.title)}</span>`
        + `<span class="lsub">${esc(l.subtitle)}</span>`
        + (meta ? `<span class="lmeta">${meta}</span>` : "")
        + `</div>`;
      return `<div class="rline${canExpand ? " can" : ""}${lo ? " lo" : ""}${isCur ? " cur" : ""}" data-line="${esc(key)}">`
        + `${chev}<span class="${sw}"></span>${main}${tag}<span class="num">${fmt(l.tokens)}</span>${st}</div>`
        + fail + (lo ? lineDetail(c, l, idx) : "");
    }

    // The shared activity behind a work line, used to spot a run of the same kind of step. We key
    // on the tool, so consecutive steps of the same kind fold even when their targets differ
    // (three reads of different files become one "Read 3 files" dropdown). A lone "Thought about
    // what to do next." row keys to null and never merges.
    function activityKey(l) {
      if (l.tool === "thinking") return null;
      return (l.tool || "").toLowerCase().trim();
    }

    // Fold consecutive lines that share an activity key into a burst, but only when there are
    // enough of them to be worth hiding (3+). Shorter runs stay as plain rows. Indices are kept
    // so each child still maps to its real work line for "explain this step".
    function groupBursts(lines) {
      const out = [];
      let i = 0;
      while (i < lines.length) {
        const key = activityKey(lines[i]);
        let j = i;
        if (key !== null) while (j + 1 < lines.length && activityKey(lines[j + 1]) === key) j++;
        if (key !== null && j - i + 1 >= 3) {
          const items = [];
          for (let k = i; k <= j; k++) items.push({ l: lines[k], idx: k });
          out.push({ burst: true, start: i, items });
        } else {
          for (let k = i; k <= j; k++) out.push({ burst: false, l: lines[k], idx: k });
        }
        i = j + 1;
      }
      return out;
    }

    // The distinct purpose titles in a folded run, first-seen order, compared case-insensitively.
    // The child rows already carry tidy purpose titles, so the parent reads off those. Mirrors
    // src/timeline/burst.ts, which is unit-tested; keep the two in sync.
    function burstDistinctTitles(items) {
      const seen = new Set();
      const out = [];
      for (const it of items) {
        const t = (it.l.title || "").trim();
        if (!t) continue;
        const key = t.toLowerCase();
        if (seen.has(key)) continue;
        seen.add(key);
        out.push(t);
      }
      return out;
    }
    function burstCountPhrase(tool, n) {
      const noun = ["Read", "Edit", "MultiEdit", "Write", "NotebookEdit"].includes(tool) ? "files"
        : ["Grep", "Glob"].includes(tool) ? "searches"
        : ["Bash", "PowerShell"].includes(tool) ? "commands" : "steps";
      const verb = { Read: "Checking", Edit: "Updating", MultiEdit: "Updating", Write: "Creating",
        NotebookEdit: "Updating", Grep: "Searching", Glob: "Searching", Bash: "Running", PowerShell: "Running" };
      return verb[tool] ? `${verb[tool]} ${n} ${noun}` : `Working through ${n} ${tool} steps`;
    }

    // A purpose summary for a folded run of same-tool steps. When every step shares one purpose,
    // that purpose names the whole run ("Inspecting session storage"); a genuinely mixed run falls
    // back to an honest count instead of dumping the raw commands.
    function burstSummary(items) {
      const titles = burstDistinctTitles(items);
      if (titles.length === 1) return titles[0];
      return burstCountPhrase(items[0].l.tool, items.length);
    }

    // The subtitle for a burst: the purposes it covered in plain English, never the raw commands
    // and never just the summary repeated back.
    function burstSubtitle(items) {
      const titles = burstDistinctTitles(items);
      if (titles.length <= 1) return `Claude did this across ${items.length} steps.`;
      const lower = titles.map((t) => t.charAt(0).toLowerCase() + t.slice(1));
      const named = lower.length === 2 ? `${lower[0]} and ${lower[1]}`
        : `${lower.slice(0, 2).join(", ")}, and ${lower.length - 2} more`;
      return `Claude worked through ${named}.`;
    }

    // One collapsed burst: a parent row that summarizes the run, expanding to the real child rows.
    function burstHtml(c, g, curIdx) {
      const key = c.id + "|b" + g.start;
      const hasCur = g.items.some((it) => it.idx === curIdx);
      const childOpen = g.items.some((it) => lineOpen.has(c.id + ":" + it.idx));
      const isOpen = burstOpen.has(key) || hasCur || childOpen;
      const head = g.items[0].l;
      const think = head.tool === "thinking";
      const anyFail = g.items.some((it) => it.l.status === "fail");
      const tokens = g.items.reduce((s, it) => s + (it.l.tokens || 0), 0);
      const sw = anyFail ? "sw fail" : think ? "sw think" : "sw";
      const chev = `<span class="lchev">${isOpen ? "&#9662;" : "&#9656;"}</span>`;
      const st = anyFail ? '<span class="st fail">fail</span>' : '<span class="st ok">&#10003;</span>';
      const children = isOpen
        ? `<div class="bchildren">${g.items.map((it) => workLineHtml(c, it.l, it.idx, it.idx === curIdx)).join("")}</div>` : "";
      const main = `<div class="lmain"><span class="lbl">${esc(burstSummary(g.items))}</span>`
        + `<span class="lsub">${esc(burstSubtitle(g.items))}</span>`
        + `<span class="lmeta">${g.items.length} ${head.tool === "thinking" ? "steps" : "items"} · ${esc(head.tool)}</span></div>`;
      return `<div class="rline brow${isOpen ? " lo" : ""}" data-burst="${esc(key)}">`
        + `${chev}<span class="${sw}"></span>${main}`
        + `<span class="tag steps">${g.items.length} steps</span><span class="num">${fmt(tokens)}</span>${st}</div>`
        + children;
    }

    function receiptHtml(c, liveTask) {
      const r = c.receipt;
      const collapsed = workCollapsed.has(c.id);
      const wchev = collapsed ? "&#9656;" : "&#9662;";
      const curIdx = liveTask ? currentLineIndex(r.workLines) : -1;
      const work = collapsed ? "" : groupBursts(r.workLines)
        .map((g) => g.burst ? burstHtml(c, g, curIdx) : workLineHtml(c, g.l, g.idx, g.idx === curIdx)).join("");
      return `<div class="rcpt">`
        + `<div class="rhead js-work" role="button" tabindex="0" aria-expanded="${!collapsed}" data-id="${c.id}">`
        + `<span class="x">${wchev}</span><span class="ttl">Work Claude did</span><span class="colh">tokens</span><span class="tot">${fmt(c.workTotal)}</span></div>`
        + work
        + `</div>`;
    }

    // A task is still open (running) when its end is past the last recorded activity; in a
    // live session that one ticks, otherwise we show how long it took.
    // Returns the bare duration string (no "took" prefix) for the inline .rmeta slot.
    function durLabel(c, snap) {
      const openEnd = c.endTs > snap.lastActivityAt;
      if (openEnd && snap.live) return `<span class="timer" data-since="${c.startTs}">${fmtDur(Date.now() - c.startTs)}</span>`;
      const end = openEnd ? snap.lastActivityAt : c.endTs;
      return c.startTs ? fmtDur(end - c.startTs) : "";
    }

    function cardHtml(c, barWarning, snap) {
      const isOpen = isCardOpen(c.id);
      // Panes pass their own live chunk id (one live task per terminal); the single view leaves it
      // unset and falls back to the global liveOpenId.
      const liveId = ("liveChunkId" in snap) ? snap.liveChunkId : liveOpenId;
      const liveTask = snap.live && c.id === liveId;
      // class list: task is the base; open/live add state. warn is a semantic hook only - it
      // carries no structural CSS; the warning shows via the amber pill on the name.
      const cls = "task"
        + (isOpen ? " open" : "")
        + (liveTask ? " live" : "")
        + (c.warnings.length ? " warn" : "");
      // bare duration, no "took" prefix - the rmeta slot is compact
      const dur = durLabel(c, snap);
      const durCls = liveTask ? "rmeta running" : "rmeta";
      const liveBadge = liveTask ? `<span class="livetag">Live</span>` : "";
      const body = isOpen
        ? `<div class="tbody">`
          + (c.narration ? `<div class="tlead">${esc(c.narration)}</div>` : "")
          + explainBlock("task", c.id)
          + receiptHtml(c, liveTask)
          + `</div>`
        : "";
      return `<div class="${cls} js-toggle" data-id="${c.id}" role="button" tabindex="0" aria-expanded="${isOpen}">`
        + `<span class="nm">${esc(c.name)} ${warningPill(c.warnings)}</span>`
        + liveBadge
        + `<span class="${durCls}">${dur}</span>`
        + `<span class="rtok">${fmt(c.workTotal)}</span>`
        + `<span class="go">&#9656;</span>`
        + body
        + `</div>`
        + (barWarning ? interventionBar(barWarning, c.id) : "");
    }

    // opts (Active Terminals panes): { follow, showEcho } overrides the single-view globals so a
    // pane uses its own Follow live state and still shows the summary echo. Omitted in the single view.
    function groupHtml(g, snap, barFor, opts) {
      const cards = g.chunks.map((c) => cardHtml(c, barFor(c), snap)).join("")
        || (g.live
          ? `<div class="grpnote think"><span class="pip"></span>Claude is thinking about your request…</div>`
          : `<div class="grpnote">Answered directly, no tools used.</div>`);
      // Eyebrow: live gets the pulsing dot, cancelled gets a quiet note, otherwise "You asked".
      const eyebrow = g.live
        ? `<div class="geye live"><span class="geye-dot"></span>Working now</div>`
        : g.cancelled
        ? `<div class="geye">You asked &middot; cancelled</div>`
        : `<div class="geye">You asked</div>`;
      // Meta one-liner: clock, duration, tokens, task count with dot separators.
      const clock = fmtClock(g.startTs);
      const dur = g.live ? liveTimer(g.startTs) : `<b>${fmtDur(g.durationMs || 0)}</b>`;
      const promptDur = g.live ? `running ${dur}` : `took ${dur}`;
      const metaLine = `<div class="pmeta">${clock}<span class="s">&bull;</span>${promptDur}<span class="s">&bull;</span><b>${fmt(g.workTotal)}</b> tok<span class="s">&bull;</span>${g.taskCount} task${g.taskCount === 1 ? "" : "s"}</div>`;
      // Heading echo: first sentence of cached summary, for skimming a completed prompt.
      const sumKey = ekey("summary", g.id);
      const sum = explCache.get(sumKey);
      const follow = opts ? opts.follow : followLive;
      const showEcho = opts ? opts.showEcho : (view === "single");
      const echo = (!g.live && sum && showEcho) ? `<div class="gecho">${esc(echoText(sum))}</div>` : "";
      const following = g.live && follow ? " following" : "";
      // When the user pressed Esc mid-turn, note it after the cards.
      const cancelNote = g.cancelled ? `<div class="grpcancel">&#9209; User cancelled Claude mid-prompt</div>` : "";
      const pmarkCls = "pmark" + (g.live ? " live" : "");
      return `<section class="grp${g.live ? " live" : ""}${g.cancelled ? " cancelled" : ""}${following}">`
        + `<div class="${pmarkCls}">${eyebrow}<div class="gtext">${esc(g.prompt)}</div>${metaLine}${echo}</div>`
        + `<div class="nodes">${cards}${cancelNote}${summaryBlock(g)}</div>`
        + `</section>`;
    }

    // Walks all receipt work lines and groups tokens into honest categories.
    // Returns { total, rows: [{label, tokens, pct}] } sorted by tokens descending.
    function tokenBreakdown(snap) {
      // Plain-language categories so a row reads as what Claude actually did, not a tool name.
      // Reading and editing are split out on purpose: "did it just look, or did it change files?"
      // is the first thing anyone wants to know from the breakdown.
      const buckets = { "Reading files": 0, "Writing files": 0, "Searching": 0, "Commands": 0, "Thinking": 0, "Other": 0 };
      for (const c of (snap.chunks || [])) {
        for (const line of (c.receipt && c.receipt.workLines || [])) {
          const t = line.tool || "";
          const tok = line.tokens || 0;
          if (t === "thinking") buckets["Thinking"] += tok;
          else if (t === "Read") buckets["Reading files"] += tok;
          else if (["Write", "Edit", "MultiEdit"].includes(t)) buckets["Writing files"] += tok;
          else if (["Grep", "Glob"].includes(t)) buckets["Searching"] += tok;
          else if (["Bash", "PowerShell"].includes(t)) buckets["Commands"] += tok;
          else buckets["Other"] += tok;
        }
      }
      const total = Object.values(buckets).reduce((a, b) => a + b, 0);
      const rows = Object.entries(buckets)
        .filter(([, v]) => v > 0)
        .sort(([, a], [, b]) => b - a)
        .map(([label, tokens]) => ({ label, tokens, pct: Math.round(tokens / total * 100) }));
      return { total, rows };
    }

    function renderSummary(snap) {
      // Derive the live task here so we don't depend on liveOpenId being set before this runs.
      const liveGroup = (snap.groups || []).find(g => g.live);
      const liveChunk = liveGroup && liveGroup.chunks.length
        ? liveGroup.chunks[liveGroup.chunks.length - 1] : null;

      const total = snap.taskCount || 0;
      const glyph = statsCollapsed ? "&laquo;" : "&raquo;";
      const expanded = !statsCollapsed;

      // --- Card 1: Right now ---
      // The green nowcard border is live-only: idle and warn states stay neutral (no green).
      const nowLive = snap.live && liveChunk && !snap.activeWarning;
      let nowCardInner;
      if (snap.activeWarning) {
        // Warn state: amber dot + stuck phrase
        nowCardInner =
          `<div class="stat" style="color:var(--warn)"><span class="d" style="background:var(--warn);box-shadow:0 0 6px rgba(224,162,58,.5);animation:none"></span>Needs a look</div>`
          + `<div class="doing" style="color:var(--body);font-weight:400">${esc(stuckPhrase(snap.activeWarning))}</div>`;
      } else if (snap.live && liveChunk) {
        const done = Math.max(0, total - 1);
        const pct = total ? Math.round(done / total * 100) : 0;
        nowCardInner =
          `<div class="stat"><span class="d"></span>Working</div>`
          + `<div class="doing">${esc(liveChunk.name)}</div>`
          + `<div class="el">current task ${liveTimer(liveChunk.startTs)}</div>`
          + `<div class="prog"><div class="pl">Session progress <b class="num">${done} / ${total} tasks</b></div>`
          + `<div class="bar"><i style="width:${pct}%"></i></div></div>`;
      } else {
        // Idle: calm non-green state, full progress bar
        const pct = total ? 100 : 0;
        const lastActive = snap.lastActivityAt
          ? "last active " + esc(ago(snap.lastActivityAt)) : "not running";
        nowCardInner =
          `<div class="stat idle"><span class="d"></span>Idle</div>`
          + `<div class="el">${lastActive}</div>`
          + `<div class="prog idle"><div class="pl">Session progress <b class="num">${total} / ${total} tasks</b></div>`
          + `<div class="bar"><i style="width:${pct}%"></i></div></div>`;
      }

      // --- Card 2: This session ---
      const sessDur = snap.live
        ? (snap.startedAt ? `${liveTimer(snap.startedAt)} <span class="dim">&bull; running</span>` : `<span class="dim">running</span>`)
        : fmtDur((snap.lastActivityAt || snap.startedAt || 0) - (snap.startedAt || 0));
      const prompts = (snap.groups || []).length;
      const bd = tokenBreakdown(snap);
      // One steady hue per category, reused across the stacked bar, legend swatch, and row bar so
      // the eye links them. Deliberately non-green: green is reserved for the single live thing.
      const colorFor = (label) => ({
        "Reading files": "var(--tok-read)", "Writing files": "var(--tok-edit)",
        "Searching": "var(--tok-search)", "Commands": "var(--tok-cmd)",
        "Thinking": "var(--tok-reason)", "Other": "var(--tok-other)",
      }[label] || "var(--tok-other)");
      // A category with real tokens but a sub-1% share shows "<1%" rather than a bare "0%", and
      // keeps a visible sliver in the bar (min-width), so nothing tiny reads as empty.
      const pctText = (p) => (p < 1 ? "<1%" : p + "%");
      const barW = (p) => Math.max(p, 1.5);
      const stackBar = bd.rows.length
        ? `<div class="tokbar">` + bd.rows.map(r =>
            `<i style="width:${barW(r.pct)}%;background:${colorFor(r.label)}" title="${esc(r.label)} ${pctText(r.pct)}"></i>`).join("") + `</div>`
        : "";
      const brkRows = bd.rows.length
        ? bd.rows.map(r => {
            const c = colorFor(r.label);
            // One clean line per category: chip, label, then count and percent right-aligned. The
            // stacked bar above carries the visual share, so the row stays a plain receipt line.
            return `<div class="brkrow">`
              + `<span class="sw" style="background:${c}"></span>`
              + `<span class="bn">${esc(r.label)}</span>`
              + `<span class="bc num">${kfmt(r.tokens)}<small>tok</small></span>`
              + `<span class="pct num">${pctText(r.pct)}</span>`
              + `</div>`;
          }).join("")
        : `<div class="tokempty">No token activity yet.</div>`;

      // Priciest task sits in its own row below the breakdown: a small label, then the task name
      // (truncated) on the left and its spend on the right, so it reads as a separate receipt line.
      const priciest = snap.priciestTaskName
        ? `<div class="tokfoot"><div class="pl">Priciest task</div>`
          + `<div class="pr"><span class="pn">${esc(snap.priciestTaskName)}</span>`
          + `<span class="pt num">${kfmt(snap.priciestTaskWork)}<small>tok</small></span></div></div>` : "";

      // Codey's own cost: what its narration, timeline, and summary calls spent, kept separate from
      // Claude's work above so it is obvious which tokens are the tool's overhead. Cost is a cache-aware
      // estimate on Haiku rates; tokens are exact.
      const zeroTot = { calls: 0, tokens: 0, costUsd: 0 };
      const ov = snap.codeyOverhead || { total: { ...zeroTot },
        byKind: { narration: { ...zeroTot }, timeline: { ...zeroTot }, summary: { ...zeroTot } } };
      const usd = (n) => (!n ? "$0.00" : n < 0.01 ? "<$0.01" : "$" + n.toFixed(2));
      // approximate cost marker, kept as a quiet prefix so the dollar figure stays the focus
      const approxCost = (n) => `<span class="approx">~</span>${usd(n)}`;
      const callsText = (t) => `${t.calls} call${t.calls === 1 ? "" : "s"}`;
      // one ledger line: name + call count on the left, tokens + cost stacked on the right
      const ovRow = (label, t, extra) =>
        `<div class="ovrow${extra || ""}">`
        + `<div><div class="ovname">${label}</div><div class="ovcalls">${callsText(t)}</div></div>`
        + `<div><div class="ovtok">${kfmt(t.tokens)}<small>tok</small></div>`
        + `<div class="ovcost">${approxCost(t.costUsd)}</div></div>`
        + `</div>`;
      const overheadCard = settings.overhead !== "1"
        ? ""
        : ov.total.calls === 0
        ? `<div class="scard"><div class="tokhd"><span class="k">Codey overhead</span></div>`
          + `<div class="toksub">What Codey itself cost this session</div>`
          + `<div class="tokempty">Nothing yet. Codey narrates as Claude works.</div></div>`
        : `<div class="scard"><div class="tokhd"><span class="k">Codey overhead</span>`
          + `<span class="toktot cost">${approxCost(ov.total.costUsd)}</span></div>`
          + `<div class="toksub">What Codey itself cost this session</div>`
          + `<div class="ovbody">`
          + ovRow("Live narration", ov.byKind.narration)
          + ovRow("Timeline", ov.byKind.timeline)
          + ovRow("Summaries", ov.byKind.summary || zeroTot)
          + ovRow("Total", ov.total, " ovtot")
          + `</div></div>`;

      // Each stats card can be hidden from the Stats settings group. Build then conditionally include.
      const nowCard = `<div class="scard${nowLive ? " nowcard" : ""}" aria-live="polite"><div class="k">Right now</div>${nowCardInner}</div>`;
      const sessionCard = `<div class="scard"><div class="k">This session</div>`
        + `<div class="pair"><span class="l">Total duration</span><span class="v num">${sessDur}</span></div>`
        + `<div class="pair"><span class="l">Prompts</span><span class="v num">${prompts}</span></div>`
        + `<div class="pair"><span class="l">Tasks</span><span class="v num">${total}</span></div>`
        + `<div class="pair"><span class="l">Total tokens</span><span class="v num">${fmt(bd.total)}</span></div>`
        + `</div>`;
      const tokCard = `<div class="scard tokcard"><div class="tokhd"><span class="k">Token breakdown</span>`
        + `<span class="toktot">${kfmt(bd.total)}<small>tok</small></span></div>`
        + `<div class="toksub">Where your tokens went</div>`
        + stackBar
        + `<div class="brk">${brkRows}</div>`
        + priciest
        + `</div>`;
      document.getElementById("summary").innerHTML =
        `<div class="sidehd"><span class="t">Session stats</span>`
        + `<button class="tog" id="stats-tog" type="button" aria-label="${expanded ? "Collapse" : "Expand"} stats" aria-expanded="${expanded}">${glyph}</button></div>`
        + `<div class="statsbody">`
        + (settings.stat_now === "1" ? nowCard : "")
        + (settings.stat_session === "1" ? sessionCard : "")
        + (settings.stat_tokens === "1" ? tokCard : "")
        + overheadCard
        + `</div>`;

      // Apply collapse class and wire the toggle (survives per-tick re-render via JS state var).
      const aside = document.getElementById("summary");
      aside.classList.toggle("collapsed", statsCollapsed);
      const tog = document.getElementById("stats-tog");
      if (tog) {
        tog.onclick = () => {
          statsCollapsed = !statsCollapsed;
          localStorage.setItem("codey-stats-collapsed", statsCollapsed ? "1" : "0");
          aside.classList.toggle("collapsed", statsCollapsed);
          tog.innerHTML = statsCollapsed ? "&laquo;" : "&raquo;";
          tog.setAttribute("aria-expanded", String(!statsCollapsed));
          tog.setAttribute("aria-label", (statsCollapsed ? "Expand" : "Collapse") + " stats");
        };
      }
    }

    function renderHeader(snap) {
      document.getElementById("sname").textContent = snap.sessionName;
      const el = document.getElementById("sproj");
      el.innerHTML = `<span class="cdot${snap.live ? " run" : ""}" style="background:${esc(snap.color || "#5fb0ff")}"></span>`
        + (snap.project ? `<span class="ptag">${esc(snap.project)}</span>` : "");
    }

    function sessRowHtml(s) {
      const active = s.id === currentId ? " active" : "";
      const live = s.running ? " live" : "";
      const proj = s.project ? ` &middot; ${esc(s.project)}` : "";
      if (s.id === renamingId) {
        return `<div class="sessrename" data-id="${esc(s.id)}">`
          + `<input class="rename-in" type="text" value="${esc(s.name)}" aria-label="New name" /></div>`;
      }
      return `<button class="sess${active}${live}" data-id="${esc(s.id)}" type="button">`
        + `<span class="sname"><span class="cdot${s.running ? " run" : ""}" style="background:${esc(s.color || "#5fb0ff")}"></span>${esc(s.name)}</span>`
        + `<span class="smeta">${ago(s.mtime)} &middot; ${s.taskCount} task${s.taskCount === 1 ? "" : "s"}${s.tokens ? " &middot; " + kfmt(s.tokens) + " tok" : ""}${proj}</span>`
        + `<span class="bm${s.saved ? " on" : ""}" data-bm role="button" aria-label="${s.saved ? "Remove bookmark" : "Bookmark"}" aria-pressed="${s.saved ? "true" : "false"}">${bmSvg()}</span>`
        + `</button>`;
    }

    // Toggle a session's bookmark: update the list optimistically, repaint, then persist server-side.
    // The next /api/sessions poll re-syncs from disk, so a failed write self-corrects.
    async function toggleBookmark(id) {
      const item = (lastSessions || []).find((s) => s.id === id);
      const next = !(item && item.saved);
      if (item) item.saved = next;
      renderRailList(lastSessions);
      try {
        await fetch("/api/session/" + encodeURIComponent(id) + "/save", {
          method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({ saved: next }),
        });
      } catch { /* the next poll re-reads the saved flag from disk */ }
    }

    // True when a session's time falls inside the From/To date filter (either bound may be open).
    function inDateRange(s) {
      const from = dateFrom ? new Date(dateFrom + "T00:00:00").getTime() : null;
      const to = dateTo ? new Date(dateTo + "T23:59:59.999").getTime() : null;
      if (from != null && s.mtime < from) return false;
      if (to != null && s.mtime > to) return false;
      return true;
    }

    function updateDateSummary() {
      const sum = document.getElementById("datesummary");
      if (!sum) return;
      const active = dateFrom || dateTo;
      sum.classList.toggle("on", !!active);
      sum.textContent = active ? `Dates: ${dateFrom || "any"} to ${dateTo || "any"}` : "Filter by date";
    }

    // Build the rail's static shell once: the search box and date filter must be stable elements
    // so typing in them is never interrupted by a list refresh. The list itself lives in #raillist
    // and is the only part that re-renders on each poll.
    function ensureRailShell() {
      if (railWired) return;
      document.getElementById("rail").innerHTML =
        `<p class="rh">Sessions</p>`
        + `<input class="railsearch" id="railsearch" type="search" placeholder="Search terminals" autocomplete="off" />`
        + `<details class="datefilter" id="datefilter"><summary id="datesummary">Filter by date</summary>`
        + `<div class="daterow">`
        + `<label class="dlab">From<input type="date" id="date-from" class="dinput" /></label>`
        + `<label class="dlab">To<input type="date" id="date-to" class="dinput" /></label></div>`
        + `<button class="dclear" id="date-clear" type="button">Clear dates</button></details>`
        + `<div class="railfilters" id="railfilters">`
        + `<span class="fchip" data-filter="all">All</span>`
        + `<span class="fchip" data-filter="saved">${bmSvg()}Saved</span></div>`
        + `<div id="raillist"></div>`;

      const search = document.getElementById("railsearch");
      search.value = railFilter;
      search.addEventListener("input", (e) => { railFilter = e.target.value; renderRailList(lastSessions); });

      const from = document.getElementById("date-from");
      const to = document.getElementById("date-to");
      from.value = dateFrom; to.value = dateTo;
      from.addEventListener("change", (e) => { dateFrom = e.target.value; updateDateSummary(); renderRailList(lastSessions); });
      to.addEventListener("change", (e) => { dateTo = e.target.value; updateDateSummary(); renderRailList(lastSessions); });
      document.getElementById("date-clear").addEventListener("click", () => {
        dateFrom = ""; dateTo = ""; from.value = ""; to.value = "";
        updateDateSummary(); renderRailList(lastSessions);
      });
      updateDateSummary();
      document.getElementById("railfilters").addEventListener("click", (e) => {
        const chip = e.target.closest(".fchip[data-filter]");
        if (!chip) return;
        savedFilter = chip.dataset.filter === "saved";
        renderRailList(lastSessions);
      });
      railWired = true;
    }

    // Reflect the active All / Saved chip. Called on every list render.
    function updateRailFilters() {
      document.querySelectorAll("#railfilters .fchip").forEach((c) =>
        c.classList.toggle("on", (c.dataset.filter === "saved") === savedFilter));
    }

    function renderRail(sessions) {
      ensureRailShell();
      renderRailList(sessions);
    }

    // Re-render just the session list (never the inputs), grouped by day.
    function renderRailList(sessions) {
      const list = document.getElementById("raillist");
      if (!list) return;
      updateRailFilters();
      const q = railFilter.trim().toLowerCase();
      const shown = sessions.filter((s) =>
        (!q || (s.name + " " + (s.project || "")).toLowerCase().includes(q))
        && inDateRange(s) && (!savedFilter || s.saved));
      let listHtml;
      if (settings.sort === "recent") {
        // Group by day, preserving the most-recent-first order the server already sorted by.
        const days = [];
        const byDay = new Map();
        for (const s of shown) {
          const d = s.day || "Earlier";
          if (!byDay.has(d)) { byDay.set(d, []); days.push(d); }
          byDay.get(d).push(s);
        }
        listHtml = days.map((d) => {
          const rows = byDay.get(d);
          return `<div class="dayhd">${esc(d)}<span class="dcount">${rows.length}</span></div>`
            + rows.map(sessRowHtml).join("");
        }).join("");
      } else {
        // Any other sort applies across every terminal, not just within a day: one flat ranked list.
        const rows = sortSessions(shown);
        listHtml = `<div class="dayhd">${esc(SORT_LABELS[settings.sort] || "Sorted")}<span class="dcount">${rows.length}</span></div>`
          + rows.map(sessRowHtml).join("");
      }
      const empty = (q || dateFrom || dateTo || savedFilter)
        ? (savedFilter ? "No bookmarked terminals yet." : "No terminals match.") : "No terminals yet.";
      list.innerHTML = shown.length ? listHtml : `<p class="smeta" style="padding-left:3px">${empty}</p>`;

      list.querySelectorAll(".sess").forEach((el) => {
        el.addEventListener("click", (e) => {
          // A click on the bookmark toggles it, never opens the session.
          if (e.target.closest("[data-bm]")) { e.stopPropagation(); toggleBookmark(el.dataset.id); return; }
          currentId = el.dataset.id; pinned = true; followLive = settings.follow === "1";
          open.clear(); closedByUser.clear(); tickSingle(); tickNow();
        });
      });

      const input = list.querySelector(".rename-in");
      if (input) {
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
        const commit = () => commitRename(renamingId, input.value);
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") { e.preventDefault(); commit(); }
          else if (e.key === "Escape") { e.preventDefault(); renamingId = null; renderRailList(lastSessions); }
        });
        input.addEventListener("blur", commit);
      }
    }

    function startRename(id) { renamingId = id; renderRailList(lastSessions); }

    async function commitRename(id, name) {
      if (!id) return;
      renamingId = null;
      try {
        await fetch("/api/session/" + encodeURIComponent(id) + "/name", {
          method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ name }),
        });
      } catch { /* keep going; the rail will refetch on the next tick */ }
      tickSingle();
    }

    async function deleteSession(id) {
      const s = lastSessions.find((x) => x.id === id);
      if (settings.confirmdelete === "1"
          && !confirm("Delete " + (s ? s.name : "this terminal") + " from the timeline? This cannot be undone.")) return;
      try { await fetch("/api/session/" + encodeURIComponent(id), { method: "DELETE" }); } catch { /* refetch handles it */ }
      if (currentId === id) { currentId = null; pinned = false; }
      tickSingle();
    }

    function renderSingle(snap) {
      lastSnap = snap;
      liveNow = !!snap.live;
      if (depth === null) { depth = snap.seedDepth || "deep"; applyMode(); }
      // Summaries default to Manual so Codey never auto-spends on recaps until the user opts in.
      if (genMode === null) genMode = "saver";
      seedEmbedded(snap);
      renderHeader(snap);
      renderControls(snap);
      renderSummary(snap);
      const chunks = snap.chunks || [];
      const groups = snap.groups || [];
      // The running task is the last task of the live prompt group, auto-opened below. Scoping to
      // the live group (not the last task overall) keeps a new prompt from lighting up the previous
      // prompt's trailing step: a fresh group has no tasks yet, so nothing reads as "running now".
      const liveGroup = groups.find((g) => g.live);
      const liveChunks = liveGroup ? liveGroup.chunks : (groups.length ? [] : chunks);
      liveOpenId = (settings.autoopen === "1" && snap.live && liveChunks.length) ? liveChunks[liveChunks.length - 1].id : null;
      // A fresh prompt re-engages Follow Live: if the live group changed since the last render,
      // the user just sent a new prompt, so snap back to following its work even if they had
      // scrolled up to read the previous turn.
      if (liveGroup && liveGroup.id !== lastLiveGroupId) {
        lastLiveGroupId = liveGroup.id;
        followLive = true;
      } else if (!liveGroup) {
        lastLiveGroupId = null;
      }
      const main = document.getElementById("main");
      if (!snap.activeWarning) confirmed.clear();
      const lastId = chunks.length ? chunks[chunks.length - 1].id : null;
      const barFor = (c) => (snap.live && snap.activeWarning && c.id === lastId ? snap.activeWarning : null);

      // Wrap in .feed for the continuous spine; empty state does not get the wrapper.
      main.innerHTML = groups.length
        ? '<div class="feed">' + groups.map((g) => groupHtml(g, snap, barFor)).join("") + "</div>"
        : (chunks.length
          ? '<div class="feed">' + chunks.map((c) => cardHtml(c, barFor(c), snap)).join("") + "</div>"
          : '<div class="empty">No activity recorded for this session yet.</div>');

      wireCards(main, () => renderSingle(snap));
      wireIntervention(main);
      wireGenerate(main, () => renderSingle(snap));
      maybeAutoSummary(snap);
    }

    // Wire every "Explain"/"Why"/"Summarize" button to its generation request.
    function wireGenerate(scope, rerender) {
      scope.querySelectorAll("[data-gen-scope]").forEach((b) => b.addEventListener("click", (e) => {
        e.stopPropagation();
        generate(b.dataset.genScope, b.dataset.genId, rerender, b.dataset.genDepth);
      }));
    }

    // In Auto, generate the recap for the single most-recently-finished prompt, once per depth.
    // Everything else (older summaries, all task and action explanations) stays click-to-generate.
    function maybeAutoSummary(snap) {
      if (genMode !== "auto" || budgetPaused) return;
      const completed = (snap.groups || []).filter((g) => !g.live);
      const target = completed[completed.length - 1];
      if (!target) return;
      const key = ekey("summary", target.id);
      if (explCache.has(key) || explLoading.has(key) || autoFired.has(key)) return;
      autoFired.add(key);
      setTimeout(() => generate("summary", target.id), 0);
    }

    // Shared expand/collapse wiring for task rows, used by both Single and Active Terminals.
    function wireCards(scope, rerender) {
      const wire = (sel, fn) => scope.querySelectorAll(sel).forEach((el) => {
        const run = () => { fn(el); rerender(); };
        el.addEventListener("click", (e) => { e.stopPropagation(); run(); });
        el.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); run(); } });
      });
      // .js-toggle is on the .task div itself; el.dataset.id holds the chunk id.
      wire(".js-toggle", (el) => {
        const id = el.dataset.id;
        if (!id) return;
        // Toggle against what is actually showing, so collapsing the auto-opened live task sticks.
        if (isCardOpen(id)) { open.delete(id); closedByUser.add(id); }
        else { open.add(id); closedByUser.delete(id); }
      });
      wire(".js-work", (el) => { const id = el.dataset.id; workCollapsed.has(id) ? workCollapsed.delete(id) : workCollapsed.add(id); });
      wire(".rline.can", (el) => { const k = el.dataset.line; lineOpen.has(k) ? lineOpen.delete(k) : lineOpen.add(k); });
      wire(".rline.brow", (el) => { const k = el.dataset.burst; burstOpen.has(k) ? burstOpen.delete(k) : burstOpen.add(k); });
      wire(".rawbtn", (el) => { const k = el.dataset.raw; rawOpen.has(k) ? rawOpen.delete(k) : rawOpen.add(k); });
    }

    function wireIntervention(scope) {
      scope.querySelectorAll(".intervene").forEach((barEl) => {
        const tool = barEl.dataset.tool;
        // The intervention has to reach the terminal that is stuck. In the single view that is the
        // open session; in an Active Terminals pane the chunk id is namespaced "sessionId~chunkId",
        // so its leading segment is the session to send to.
        const chunk = barEl.dataset.chunk || "";
        const sid = chunk.includes("~") ? chunk.split("~")[0] : currentId;
        barEl.querySelectorAll(".ibtn").forEach((btn) => {
          btn.addEventListener("click", async (e) => {
            e.stopPropagation();
            const action = btn.dataset.action;
            barEl.querySelectorAll(".ibtn").forEach((b) => (b.disabled = true));
            try {
              await fetch("/api/session/" + encodeURIComponent(sid) + "/intervene", {
                method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ action }),
              });
            } catch { /* the Esc path is the real stop */ }
            confirmed.set(barEl.dataset.chunk, action);
            tick();
          });
        });
        const copyBtn = barEl.querySelector(".copybtn");
        if (copyBtn) copyBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          navigator.clipboard?.writeText(FALLBACK[barEl.dataset.action].type.replace("{tool}", tool));
          copyBtn.textContent = "Copied";
        });
      });
    }

    // ---- polling ----
    async function tickSingle() {
      let sessions = [];
      try { sessions = await (await fetch("/api/sessions")).json(); } catch { sessions = []; }
      if (view !== "single") return; // a view switch landed while this fetch was in flight
      lastSessions = sessions;
      if (!pinned && sessions[0]) currentId = sessions[0].id;
      const anyRunning = sessions.some((s) => s.running);
      updateLiveBadge(sessions.filter((s) => s.running).length);
      // Don't redraw the rail mid-rename or the input loses focus and the typed text.
      if (!renamingId) renderRail(sessions);
      // Only offer "Jump to live" when there is something live to jump to.
      document.getElementById("jumplive").hidden = !(pinned && anyRunning);
      if (!currentId) { document.getElementById("main").innerHTML = '<div class="empty">No sessions found.</div>'; return; }
      try {
        const snap = await (await fetch("/api/session/" + encodeURIComponent(currentId))).json();
        if (view !== "single") return;
        renderSingle(snap);
      } catch { /* keep last view on a transient error */ }
    }

    document.getElementById("jumplive").addEventListener("click", () => {
      pinned = false; document.getElementById("jumplive").hidden = true; tick();
    });
    document.getElementById("tb-single").addEventListener("click", () => setView("single"));
    document.getElementById("tb-split").addEventListener("click", () => setView("split"));
    document.getElementById("rename-current").addEventListener("click", () => {
      if (currentId) startRename(currentId);
    });
    document.getElementById("delete-current").addEventListener("click", () => {
      if (currentId) deleteSession(currentId);
    });
    function setView(v) {
      view = v;
      document.body.classList.toggle("split", v === "split");
      document.getElementById("tb-single").classList.toggle("on", v === "single");
      document.getElementById("tb-split").classList.toggle("on", v === "split");
      document.getElementById("rail").style.display = v === "split" ? "none" : "";
      document.getElementById("summary").style.display = v === "split" ? "none" : "";
      document.getElementById("jumplive").hidden = true;
      renderNow(view === "single" ? nowState : null);
      // Paint the target view from cache immediately so the previous view's content never lingers
      // or flashes while the fresh data is in flight.
      const main = document.getElementById("main");
      if (v === "split") {
        if (lastLive) renderSplit(lastLive); else main.innerHTML = '<div class="empty">Loading…</div>';
      } else {
        if (lastSnap) renderSingle(lastSnap); else main.innerHTML = '<div class="empty">Loading…</div>';
      }
      tick();
    }

    function updateLiveBadge(n) {
      document.getElementById("livecount").textContent = n;
      const wrap = document.getElementById("livewrap");
      // Always visible: when 0 it shows a calm "idle" state so a still badge never looks frozen.
      wrap.classList.toggle("idle", n === 0);
      document.getElementById("livelabel").textContent = n === 0 ? "idle" : "live";
    }

    // ---- Active Terminals (multi-session) ----
    // Two full-size terminals side by side per page; the pager walks the rest. Bounded so a
    // machine with many open terminals does not re-render dozens of full receipts every tick.
    const SPLIT_PER_PAGE = 2;
    let lastLive = null; // keep the last payload so pager clicks re-render without a refetch
    // Each pane runs its own Follow live, independent of the others and of the single view: one
    // terminal can follow its live work while another stays parked where the user is reading.
    // Follow live is exclusive across panes: at most one terminal follows at a time. A pane only
    // follows when it explicitly holds the slot (absent = not following), and reconcileAutoFollow
    // hands that slot to the most recently prompted running terminal, so two live terminals never
    // both auto-scroll at once.
    const paneFollow = {};       // sessionId -> bool (true = holds the single follow slot)
    const paneLiveGroupId = {};  // sessionId -> last live group id, to detect a fresh prompt
    const paneFollowOn = (sid) => paneFollow[sid] === true;
    // Each pane carries its own explanation depth so one terminal can read Simple while another
    // reads Deep, with no swapping. Absent -> fall back to that session's seed depth, then "deep".
    const paneDepth = {};        // sessionId -> "simple" | "deep" | "teach"
    const paneDepthOn = (sid, seed) => paneDepth[sid] || seed || "deep";

    async function dismissTerminal(id) {
      try { await fetch("/api/session/" + encodeURIComponent(id) + "/dismiss", { method: "POST" }); } catch { /* refetch handles it */ }
      tickSplit();
    }
    async function restoreTerminal(id) {
      try { await fetch("/api/session/" + encodeURIComponent(id) + "/restore", { method: "POST" }); } catch { /* refetch handles it */ }
      tickSplit();
    }

    // The "Hidden (N)" tray: dismissed terminals offered back for restore. Empty -> nothing shown.
    function hiddenTrayHtml(hidden) {
      if (!hidden || hidden.length === 0) return "";
      const chips = hidden.map((h) =>
        `<span class="hidchip"><span class="hcdot" style="background:${esc(h.color || "#5fb0ff")}"></span>${esc(h.name)}`
        + `<button type="button" data-restore="${esc(h.sessionId)}">Restore</button></span>`).join("");
      return `<div class="hiddentray"><span class="htlab">Hidden (${hidden.length}):</span>${chips}</div>`;
    }

    function paneHtml(s, isFirst) {
      const sid = s.sessionId;
      // A pane is "live" (amber frame) whenever the terminal is running: mid-tool OR thinking.
      // A cancelled turn gets a quiet amber frame too, so an interrupted terminal reads as such.
      const cls = "pane" + (s.running ? " run" : "") + (s.cancelled && !s.running ? " cancelled" : "");
      const pill = s.thinking ? `<span class="badge think">&#9670; Thinking</span>`
        : isFirst && s.running ? `<span class="badge">&#10022; Just prompted</span>` : "";
      const proj = s.project ? `<span class="pproj">${esc(s.project)}</span>` : "";
      const dismissBtn = `<button class="pdismiss" type="button" data-dismiss="${esc(sid)}" title="Hide this terminal" aria-label="Hide this terminal">&times;</button>`;
      // Full prompt history, oldest on top, newest below: a pane is a real single-terminal timeline,
      // not a single overwriting receipt. Namespace each group and chunk id with the session so
      // expand state and "Summarize"/"Explain" requests route to this terminal, never a neighbour.
      const groups = (s.groups || []).map((g) => ({
        ...g, id: sid + "~" + g.id,
        chunks: g.chunks.map((c) => ({ ...c, id: sid + "~" + c.id })),
      }));
      // Which follow slot this pane holds was decided centrally in reconcileAutoFollow before this
      // render, so a fresh prompt in the most recent terminal wins it and parks the rest.
      const liveGroup = groups.find((g) => g.live);
      // The pane's one live task (last task of its live group), so cardHtml lights the right row.
      const liveChunks = liveGroup ? liveGroup.chunks : [];
      const liveChunkId = s.running && liveChunks.length ? liveChunks[liveChunks.length - 1].id : null;
      const follow = paneFollowOn(sid);
      const pd = paneDepthOn(sid, s.seedDepth);
      // Pseudo-snapshot for the shared card/group renderers: this pane's own live flag and live row.
      const lastFinite = groups.reduce((m, g) => Math.max(m, g.endTs < 1e15 ? g.endTs : g.startTs), 0) || Date.now();
      const pseudo = { live: s.running, lastActivityAt: lastFinite, liveChunkId };
      // A stuck terminal offers the same "step in" bar as the single view, on its current live task.
      const paneWarn = s.running ? s.activeWarning : null;
      const paneBar = (c) => (paneWarn && c.id === liveChunkId ? paneWarn : null);

      // Build this pane's body under its own depth so every Explain/Summarize block keys and labels
      // at the pane's depth. Reset to null right after, so the next pane (or the single view) is clean.
      renderDepth = pd;
      let body;
      if (groups.length) {
        body = `<div class="feed">`
          + groups.map((g) => groupHtml(g, pseudo, paneBar, { follow, showEcho: true })).join("")
          + `</div>`;
      } else if (s.thinking) {
        body = `<div class="pthink"><span class="pip"></span>Thinking about your request…</div>`;
      } else if (s.cancelled) {
        body = `<div class="grpcancel">&#9209; User cancelled Claude mid-prompt</div>`;
      } else {
        body = `<div class="pnote"><span class="pn1">Answered directly</span>No tools used for this prompt.</div>`;
      }
      renderDepth = null;
      // Per-pane Follow live toggle, shown only while the terminal is live. Off keeps the user's
      // scroll put; the "Jump to live" affordance below surfaces when new work lands out of view.
      const followBtn = s.running
        ? `<button class="pfollow${follow ? " on" : ""}" type="button" data-follow="${esc(sid)}">`
          + `<span class="fd"></span>${follow ? "Following" : "Follow live"}</button>` : "";
      const jump = s.running
        ? `<button class="pjump" type="button" data-jump="${esc(sid)}" hidden>New live activity &#8595;</button>` : "";
      // This pane's own depth control: Simple/Deep/Teach, scoped to this terminal only.
      const dseg = (val, lab) => `<button class="${val === pd ? "on" : ""}" type="button" data-pdepth="${esc(sid)}" data-pd-val="${val}">${lab}</button>`;
      const depthCtl = `<span class="pdepth"><span class="pdl">Depth</span><span class="pseg">`
        + dseg("simple", "Simple") + dseg("deep", "Deep") + dseg("teach", "Teach") + `</span></span>`;
      return `<div class="${cls}" data-sid="${esc(sid)}"><div class="phead">`
        + `<span class="cdot${s.running ? " run" : ""}" style="background:${esc(s.color || "#5fb0ff")}"></span>`
        + `<span class="pname">${esc(s.name)}</span>${proj}${pill}`
        + `<span class="pwork"><b>${fmt(s.workTotal)}</b> tokens</span>${depthCtl}${followBtn}${dismissBtn}</div>`
        + `<div class="pbody" data-sid="${esc(sid)}">${body}</div>${jump}</div>`;
    }

    // Locate a pane by session id without trusting the id in a CSS selector.
    function paneEl(sid) {
      return [...document.querySelectorAll(".pane[data-sid]")].find((p) => p.dataset.sid === sid) || null;
    }
    const paneAtBottom = (body) => body.scrollHeight - (body.scrollTop + body.clientHeight) < 28;

    // Read each pane's current scroll before a re-render so a parked pane can be put back exactly,
    // instead of snapping to the top every tick when its innerHTML is replaced.
    function capturePaneScroll() {
      const map = {};
      document.querySelectorAll(".pbody[data-sid]").forEach((el) => { map[el.dataset.sid] = el.scrollTop; });
      return map;
    }
    // After a re-render: a following live pane sticks to the bottom; every other pane is restored
    // to where the user left it. Then refresh each pane's "Jump to live" affordance.
    function applyPaneScroll(saved) {
      document.querySelectorAll(".pbody[data-sid]").forEach((el) => {
        const sid = el.dataset.sid;
        const pane = el.closest(".pane");
        const running = pane && pane.classList.contains("run");
        if (running && paneFollowOn(sid)) el.scrollTop = el.scrollHeight;
        else if (sid in saved) el.scrollTop = saved[sid];
        updateJump(sid);
      });
    }
    // Show the affordance only when a pane is live, not following, and parked away from the bottom.
    function updateJump(sid) {
      const pane = paneEl(sid);
      if (!pane) return;
      const body = pane.querySelector(".pbody");
      const jump = pane.querySelector(".pjump");
      if (!body || !jump) return;
      const running = pane.classList.contains("run");
      jump.hidden = !(running && !paneFollowOn(sid) && !paneAtBottom(body));
    }
    // Paint one pane's Follow live button + live-group state and (if following) snap it to the live edge.
    function paintPaneFollow(sid) {
      const pane = paneEl(sid);
      if (!pane) return;
      const on = paneFollowOn(sid);
      const btn = pane.querySelector(".pfollow");
      if (btn) { btn.classList.toggle("on", on); btn.innerHTML = `<span class="fd"></span>${on ? "Following" : "Follow live"}`; }
      pane.querySelectorAll(".grp.live").forEach((g) => g.classList.toggle("following", on));
      const body = pane.querySelector(".pbody");
      if (on && body) body.scrollTop = body.scrollHeight;
      updateJump(sid);
    }
    // Follow live is exclusive: only one terminal follows at a time. Turning one on parks every
    // other running pane, so the live edge the user is watching is unambiguous. Turning one off
    // just parks that pane and leaves the rest alone.
    function setPaneFollow(sid, on) {
      paneFollow[sid] = on;
      if (on) {
        document.querySelectorAll(".pane.run[data-sid]").forEach((pane) => {
          const other = pane.dataset.sid;
          if (other && other !== sid && paneFollowOn(other)) {
            paneFollow[other] = false;
            paintPaneFollow(other);
          }
        });
      }
      paintPaneFollow(sid);
    }
    // Switch one pane's depth and re-render so its explanations re-key and relabel at the new depth.
    function setPaneDepth(sid, d) {
      if (paneDepth[sid] === d) return;
      paneDepth[sid] = d;
      renderSplit(lastLive);
    }
    // Wire each pane's follow toggle, jump button, and scroll/wheel behaviour. A deliberate scroll
    // up in a pane means "let me read", so it parks that pane (and only that pane).
    function wirePanes(main) {
      main.querySelectorAll("[data-pdepth]").forEach((b) =>
        b.addEventListener("click", (e) => { e.stopPropagation(); setPaneDepth(b.dataset.pdepth, b.dataset.pdVal); }));
      main.querySelectorAll("[data-follow]").forEach((b) =>
        b.addEventListener("click", (e) => { e.stopPropagation(); setPaneFollow(b.dataset.follow, !paneFollowOn(b.dataset.follow)); }));
      main.querySelectorAll("[data-jump]").forEach((b) =>
        b.addEventListener("click", (e) => { e.stopPropagation(); setPaneFollow(b.dataset.jump, true); }));
      main.querySelectorAll(".pbody[data-sid]").forEach((el) => {
        el.addEventListener("wheel", (e) => {
          if (e.deltaY < 0 && paneFollowOn(el.dataset.sid)) setPaneFollow(el.dataset.sid, false);
        }, { passive: true });
        el.addEventListener("scroll", () => updateJump(el.dataset.sid), { passive: true });
      });
    }

    // Hand the single Follow-live slot to the most recently prompted terminal that just started a
